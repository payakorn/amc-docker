services:
  amc:
    build:
      context: .
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: amc-desktop:latest
    container_name: amc
    hostname: amc

    # Left of the colon is the port on the host, right of it the port inside the
    # container. Only the host side is configurable — the services inside always
    # listen on 8080/6080/5901, and the healthcheck below talks to those.
    ports:
      # The web interface: edit questions, check, compile, capture, mark,
      # export. Most sessions live here — if you open one port, open this
      # one. It has its own bind address, separate from the desktop's below:
      # opening the batch workflow to the LAN doesn't have to mean opening
      # unencrypted VNC too.
      - "${WEB_BIND_ADDR:-${BIND_ADDR:-127.0.0.1}}:${WEB_PORT:-6090}:8080"
      # noVNC web client — the full AMC desktop, for reviewing ambiguous boxes
      # and matching papers to students.
      - "${BIND_ADDR:-127.0.0.1}:${NOVNC_PORT:-6091}:6080"
      # Raw VNC, for macOS Screen Sharing (vnc://<host>:6092). Smoother than
      # the browser for long marking sessions; drop this line if unused.
      - "${BIND_ADDR:-127.0.0.1}:${VNC_PORT:-6092}:5901"

    environment:
      VNC_PASSWORD: ${VNC_PASSWORD:-amc2026}
      VNC_GEOMETRY: ${VNC_GEOMETRY:-1600x1000}
      # Where AMC looks for projects: the exam/ folder inside the mounted repo.
      AMC_PROJECTS_DIR: /work/repo/${AMC_PROJECTS_SUBDIR:-exam}
      AMC_LATEX_ENGINE: ${AMC_LATEX_ENGINE:-pdflatex}
      AMC_AUTOSTART: ${AMC_AUTOSTART:-1}
      AMC_REPO: /work/repo
      # Web interface. AMC_WEB=0 turns it off and leaves the desktop alone.
      # AMC_WEB_TOKEN is only needed if you publish the port beyond localhost:
      # this service runs shell commands on request, so treat it accordingly.
      AMC_WEB: ${AMC_WEB:-1}
      AMC_WEB_TOKEN: ${AMC_WEB_TOKEN:-}
      # The container cannot see how Docker published its ports, so tell it.
      # Anything other than a loopback address means "reachable from the LAN",
      # and the entrypoint then insists on a web token. This is the web
      # service's own bind address — it's the one running shell commands, so
      # it's the one whose exposure decides whether a token gets minted.
      AMC_BIND_ADDR: ${WEB_BIND_ADDR:-${BIND_ADDR:-127.0.0.1}}
      # Same reason: the web interface's "open the desktop" button and the URLs
      # in the startup log are for a browser, so they need the published ports,
      # not the internal 6080/8080.
      AMC_NOVNC_PUBLIC_PORT: ${NOVNC_PORT:-6091}
      AMC_WEB_PUBLIC_PORT: ${WEB_PORT:-6090}
      GIT_USER_NAME: ${GIT_USER_NAME:-}
      GIT_USER_EMAIL: ${GIT_USER_EMAIL:-}

    volumes:
      # The exam folder (./exams by default), live: edits and compiled PDFs land straight in the
      # working tree on the Mac, and git inside the container is the same repo.
      - ${EXAM_REPO:-./exams}:/work/repo
      # SSH keys for pushing to GitHub, read-only (copied and re-permissioned
      # inside the container by the entrypoint).
      - ${SSH_DIR:-./ssh}:/ssh-host:ro
      # Drop extra .ttf/.otf here (e.g. TH Sarabun New) to make them available
      # to XeLaTeX and to the desktop.
      - ./fonts:/usr/local/share/fonts/custom:ro
      # AMC's own settings, window sizes and templates, kept across rebuilds.
      - amc-home:/home/amc

    # AMC's scan analysis is image-heavy; the 64MB default /dev/shm is not enough.
    shm_size: "1gb"

    restart: unless-stopped

    healthcheck:
      # Both front doors, because either can fail on its own: websockify dying
      # leaves the web app up, and vice versa.
      test: ["CMD-SHELL",
             "curl -fsS -o /dev/null http://localhost:6080/vnc.html && { [ \"$$AMC_WEB\" != 1 ] || curl -fsS -o /dev/null http://localhost:8080/healthz; }"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

volumes:
  amc-home:
